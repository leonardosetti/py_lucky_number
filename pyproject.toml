[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lucky-number"
version = "0.1.0"
description = "Gera combinações de números aleatórios para loterias da Caixa que nunca foram sorteadas anteriormente"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "orjson>=3.9",
    "polars>=1.0",
    "celery>=5.3",
    "redis>=5.0",
    "slowapi>=0.1",
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "hypothesis>=6.118.0",
    "respx>=0.21",
    "pytest-benchmark>=4.0",
]

[project.scripts]
lucky-number = "lucky_number.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/lucky_number --cov-report=term --cov-fail-under=90"

[tool.coverage.run]
source = ["src/lucky_number"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]
fail_under = 90
