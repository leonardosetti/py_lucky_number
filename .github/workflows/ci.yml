# Lucky Number — CI Pipeline (Spec 006)
# Runs on PRs and merges to main/develop
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  ENVIRONMENT: test
  DATABASE_URL: postgresql+asyncpg://lucky:lucky@localhost:5432/lucky_test
  JWT_SECRET_KEY: test-secret-key-not-for-production

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lucky
          POSTGRES_PASSWORD: lucky
          POSTGRES_DB: lucky_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint (ruff + flake8)
        run: |
          ruff check src/ tests/
          flake8 src/ tests/

      - name: Security scan (bandit)
        run: bandit -r src/ -c pyproject.toml

      - name: Dependency security scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --requirement=requirements.txt --requirement=requirements-dev.txt --skip-editable --ignore-vuln MAL-2026-4750

      - name: Type check (mypy)
        run: mypy src/lucky_number || true

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=src/lucky_number --cov-report=term --cov-fail-under=70

      - name: Run migrations
        run: |
          alembic upgrade head
