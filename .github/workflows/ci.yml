# Lucky Number — CI Pipeline (Spec 006)
# Runs on PRs and merges to main/develop
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  ENVIRONMENT: test
  DATABASE_URL: postgresql+asyncpg://lucky:lucky@localhost:5432/lucky_test

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lucky
          POSTGRES_PASSWORD: lucky
          POSTGRES_DB: lucky_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint (ruff + flake8)
        run: |
          ruff check src/ tests/
          flake8 src/ tests/

      - name: Security scan (bandit)
        run: bandit -r src/ -c pyproject.toml

      - name: Type check (mypy)
        run: mypy src/lucky_number || true

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=src/lucky_number --cov-report=term --cov-fail-under=70

      - name: Run migrations
        run: |
          alembic upgrade head
